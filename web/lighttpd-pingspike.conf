# Lighttpd configuration snippet for pingspike.mikelcodez.xyz
# Place in /etc/lighttpd/conf-available/99-pingspike.conf

$HTTP["host"] == "pingspike.mikelcodez.xyz" {
    # If proxying to the Docker container:
    # proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8088 ) ) )

    # OR if serving directly static files:
    server.document-root = "/var/www/pingspike/public"
    index-file.names = ( "index.html" )

    # Enable gzip / MIME types
    mimetype.assign = (
        ".html" => "text/html",
        ".css"  => "text/css",
        ".js"   => "application/javascript",
        ".png"  => "image/png",
        ".jar"  => "application/java-archive"
    )
}
