plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pingspikeindicator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

def pureJavaSources = fileTree("src/main/java") {
	include "**/*.java"
}

tasks.register("verifyPureJavaBoundaries") {
	group = "verification"
	description = "Rejects Minecraft, Fabric, and Mixin imports in the pure Java source set."
	inputs.files(pureJavaSources)

	doLast {
		def forbiddenImport = ~/^\s*import\s+(static\s+)?(net\.minecraft|net\.fabricmc|org\.spongepowered\.asm\.mixin)(\.|;).*/
		def violations = []

		pureJavaSources.files.sort().each { sourceFile ->
			sourceFile.readLines().eachWithIndex { line, index ->
				if (line ==~ forbiddenImport) {
					violations << "${sourceFile}:${index + 1}: ${line.trim()}"
				}
			}
		}

		if (!violations.isEmpty()) {
			throw new GradleException("Pure Java boundary violations:\n${violations.join('\n')}")
		}
	}
}

def fabricModMetadata = file("src/main/resources/fabric.mod.json")

tasks.register("verifyClientOnlyMetadata") {
	group = "verification"
	description = "Rejects server/common entrypoints or a non-client Fabric environment."
	inputs.file(fabricModMetadata)

	doLast {
		def metadata = new groovy.json.JsonSlurper().parse(fabricModMetadata)
		if (metadata.environment != "client") {
			throw new GradleException("fabric.mod.json environment must be client")
		}

		def entrypointKinds = (metadata.entrypoints ?: [:]).keySet() as Set
		if (entrypointKinds != (["client", "modmenu"] as Set) && entrypointKinds != (["client"] as Set)) {
			throw new GradleException("fabric.mod.json must contain only client and modmenu entrypoints")
		}
	}
}

tasks.named("check") {
	dependsOn tasks.named("verifyPureJavaBoundaries")
	dependsOn tasks.named("verifyClientOnlyMetadata")
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

	exclude "com/terraformersmc/modmenu/api/**"
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
